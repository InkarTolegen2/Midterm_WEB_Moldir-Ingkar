<html>
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">📷</span>
        </div>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="services.html">Service</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="section-title">
            <h2>Book a Session</h2>
            <p>Tell us about your project</p>
        </div>

        <form class="contact-form" action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required />

            <label ofr="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />

            <label for="service">Service Type</label>
            <select id="service" name="service" required >
                <option value="">-- Select --</option>
                <option>Portrait</option>
                <option>Wedding</option>
                <option>Event</option>
                <option>Other</option>
            </select>

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me more..."></textarea>

            <button type="submitomt" class="btn-primary-custom">Send Request</button>
        </form>
    </main>

    <footer class="footer">
        <div>
            <h4> Lens &amp; Light</h4>
            <p>Capturing moments that last forever.</p>
        </div>
        <div>
            <h4>Contact</h4>
            <p>lensandlight@gmail.com</p>
            <p>+7 (777) 777 77 77</p>
        </div>
        <div>
            <h4>Follow</h4>
            <ul class="social-links">
                <li><a href="#">Instagram</a></li>
                <li><a href="#">TikTok</a></li>
                <li><a href="#">Pinterest</a></li>
            </ul>
        </div>
        <p class="copyright">&copy; 2026 Lens &amp; Light. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
